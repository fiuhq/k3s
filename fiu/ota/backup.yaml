# Nightly: dump the database (apps, channels, sealed signing keys) and upload it to R2 under backups/, one object per
# day, so the server can be rebuilt on another node with the master key from the operator's secrets file.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: dump
              image: postgres:18.6-alpine
              command: ["sh", "-c", "pg_dump -h postgres -U xprem -d xprem -Fc -f /work/xprem.dump && ls -l /work/xprem.dump"]
              env:
                - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: xprem-secrets, key: POSTGRES_PASSWORD } } }
              volumeMounts:
                - { name: work, mountPath: /work }
          containers:
            - name: upload
              image: curlimages/curl:8.23.0
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  key="backups/xprem-$(date -u +%Y-%m-%d).dump"
                  curl -sS -f --max-time 300 -X PUT --data-binary @/work/xprem.dump --aws-sigv4 aws:amz:auto:s3 \
                    --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY" "$AWS_BASE_ENDPOINT/$S3_BUCKET_NAME/$key"
                  echo "uploaded $key"
              envFrom:
                - configMapRef: { name: xprem-config }
                - secretRef: { name: xprem-secrets }
              volumeMounts:
                - { name: work, mountPath: /work }
          volumes:
            - name: work
              emptyDir: {}
