# Phase 0 of running Paseo agents as pods: one Sandbox on g14 holding a Paseo daemon with its agents.
# Its home (worktrees, Paseo history, agent sessions) is its own volume; code leaves through git push.
apiVersion: v1
kind: Namespace
metadata:
  name: paseo-agents
---
apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: trial
  namespace: paseo-agents
spec:
  operatingMode: Running
  volumeClaimTemplates:
    - metadata:
        name: home
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
  podTemplate:
    metadata:
      labels:
        app: paseo-agent
        sandbox: trial
    spec:
      nodeSelector:
        fiu.one/node: g14
      initContainers:
        # Logins arrive as a Secret and are copied into the home, which the agent CLIs write to.
        - name: logins
          image: fiuhq/paseo-agent:trial
          imagePullPolicy: Never
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /home/paseo/.claude
              # The newer login wins: the home's when Claude refreshed it in the pod after the Secret's was written,
              # the Secret's when it was lent again since. Compared by claudeAiOauth.expiresAt; an unreadable home copy loses.
              creds=/home/paseo/.claude/.credentials.json
              node -e '
                const fs = require("node:fs");
                const at = (f) => { try { return JSON.parse(fs.readFileSync(f, "utf8")).claudeAiOauth?.expiresAt ?? 0; } catch { return -1; } };
                process.exit(at(process.argv[1]) > at(process.argv[2]) ? 0 : 1);
              ' "$creds" /logins/claude-credentials.json || cp /logins/claude-credentials.json "$creds"
              chmod 600 "$creds"
              cat > /home/paseo/.gitconfig <<GIT
              [credential "https://github.com"]
              	helper = !gh auth git-credential
              [user]
              	name = $(cat /logins/git-name)
              	email = $(cat /logins/git-email)
              GIT
              chown -R 1000:1000 /home/paseo
              # The agent CLIs live in the home, installed by each vendor's own installer, so their own updaters keep
              # them current there (the same installs fiu runs on every fleet machine).
              gosu paseo bash -c '
                set -eu
                [ -x ~/.local/bin/claude ] || curl -fsSL https://claude.ai/install.sh | bash
                [ -x ~/.opencode/bin/opencode ] || curl -fsSL https://opencode.ai/v2/install | bash
                [ -x ~/.local/bin/codex ] || npm install -g --prefix ~/.local @openai/codex
              '
          volumeMounts:
            - { name: home, mountPath: /home/paseo }
            - { name: logins, mountPath: /logins, readOnly: true }
      containers:
        - name: paseo
          image: fiuhq/paseo-agent:trial
          imagePullPolicy: Never
          ports:
            - { name: paseo, containerPort: 6767 }
          env:
            - { name: PATH, value: "/home/paseo/.local/bin:/home/paseo/.opencode/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" }
            - { name: PASEO_CORS_ORIGINS, value: "https://paseo.fiu.one,https://app.paseo.sh" }
            - { name: PASEO_HOSTNAMES, value: "g14-fleet.tail09fc2.ts.net,localhost" }
            - name: GH_TOKEN
              valueFrom: { secretKeyRef: { name: paseo-agent-logins, key: gh-token } }
            # Every connection signs in: any pod in the cluster can reach this one, including those behind the
            # public tunnel. The operator's secrets file holds the same password for the app.
            - name: PASEO_PASSWORD
              valueFrom: { secretKeyRef: { name: paseo-agent-logins, key: paseo-password } }
          resources:
            requests: { cpu: "500m", memory: 1Gi }
            limits: { memory: 6Gi }
          volumeMounts:
            - { name: home, mountPath: /home/paseo }
      volumes:
        - name: logins
          secret:
            secretName: paseo-agent-logins
            defaultMode: 0400
---
# The daemon signs every connection in (PASEO_PASSWORD) and its Service stays inside the cluster, never a NodePort,
# which opens a port on every interface of every node. tailscale serve on the g14 VM proxies https://g14-fleet.tail09fc2.ts.net:8443 to its cluster address (the VM's own Paseo
# keeps 6767): tailscale serve --bg --https=8443 http://<this Service's ClusterIP>:6767
apiVersion: v1
kind: Service
metadata:
  name: trial-tailnet
  namespace: paseo-agents
spec:
  type: ClusterIP
  selector:
    sandbox: trial
  ports:
    - { name: paseo, port: 6767, targetPort: paseo }
