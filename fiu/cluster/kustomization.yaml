# Cluster-wide pieces, applied with `fiu/cluster/apply.sh`: it creates the cloudflared-token Secret, then applies this
# twice, because the second apply creates the upgrade Plans once the system-upgrade-controller CRD is established.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # k3s's own updater: every node follows the stable channel, servers first.
  # Vendored from the v0.21.0 release assets (gh release download), so an apply never depends on the release CDN.
  - system-upgrade-controller/crd.yaml
  - system-upgrade-controller/system-upgrade-controller.yaml
  - upgrade-plans.yaml
  # The tunnel connector every public site goes through.
  - cloudflared.yaml
  # Moves a workload back to the node it prefers once that node is Ready again (failback to the Mac).
  - https://github.com/kubernetes-sigs/descheduler//kubernetes/deployment?ref=v0.37.0

patches:
  - path: descheduler-policy.yaml
  - target:
      kind: Deployment
      name: descheduler
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/3
        value: "1m"
