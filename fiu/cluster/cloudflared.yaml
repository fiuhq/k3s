# The cluster's way in from the internet: a Cloudflare Tunnel connector. The tunnel, its routes (hostname → in-cluster
# service), DNS and Access are declared outside this repo; this only runs the connector, one replica per node so the
# tunnel stays up on whichever node is. The token comes from the cloudflared-token Secret that apply.sh creates.
# HTTP/2 over TCP 443: QUIC (UDP 7844) never connected from either node.
apiVersion: v1
kind: Namespace
metadata:
  name: cloudflared
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      affinity:
        # Required, not preferred: a preference left both replicas on one node after the other came back. With a node
        # down, its replica waits in Pending while the other keeps the tunnel up.
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: cloudflared
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.7
          args: ["tunnel", "--no-autoupdate", "--protocol", "http2", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom: { secretKeyRef: { name: cloudflared-token, key: token } }
          livenessProbe:
            httpGet: { path: /ready, port: 2000 }
            initialDelaySeconds: 10
            periodSeconds: 10
