# Checks for the fiu/ directory this fork carries (see fiu/README.md). Upstream's workflows never run for it.
name: fiu
on:
  pull_request:
    paths:
      - "fiu/**"
      - ".github/workflows/fiu.yaml"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shell scripts parse and pass shellcheck
        run: |
          for f in fiu/server/bootstrap.sh fiu/agent/bootstrap.sh fiu/cluster/apply.sh fiu/ota/deploy.sh fiu/wsl-mirrored/fiu-pod-masq; do sh -n "$f"; done
          shellcheck -S warning fiu/server/bootstrap.sh fiu/agent/bootstrap.sh fiu/cluster/apply.sh fiu/ota/deploy.sh fiu/wsl-mirrored/fiu-pod-masq
      - name: Cluster kustomization renders
        run: kubectl kustomize fiu/cluster > /dev/null
      - name: OTA server renders
        run: |
          # deploy.sh writes these from the operator's secrets at deploy time; placeholders are enough to render.
          mkdir -p fiu/ota/generated
          printf 'BASE_URL=https://example.invalid\nS3_BUCKET_NAME=bucket\n' > fiu/ota/generated/public.env
          printf 'POSTGRES_PASSWORD=x\nJWT_SECRET=x\n' > fiu/ota/generated/secrets.env
          kubectl kustomize fiu/ota > /dev/null

